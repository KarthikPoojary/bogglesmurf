name: Android Build

# Builds a debug APK and uploads it as a workflow artifact.
# Trigger manually or by pushing a mobile-v* tag (which also creates a GitHub Release).
on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle (no PWA service worker)
        run: MOBILE=1 pnpm build

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Sync web assets into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bogglesmurf-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # On mobile-v* tag: create a GitHub Release with the APK attached
      # so the phone browser can install it in one tap (direct .apk link).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          name: BoggleSmurf Android ${{ github.ref_name }}
          body: |
            Debug APK for sideloading.

            **Install on Android:**
            1. Tap the `app-debug.apk` link below to download
            2. Open it in Files by Google → tap to install
            3. If prompted, enable *Install unknown apps* for your browser/file manager
