name: Android Bootstrap

# Run once to scaffold mobile/android/ via Capacitor and push it as a branch.
# After it completes, open a PR from mobile/android-scaffold → main via GitHub UI.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Scaffold Android project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web bundle (no PWA service worker)
        run: MOBILE=1 pnpm build

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Scaffold Android project (cap add android)
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "mobile/android/ already exists — skipping cap add"
          fi

      - name: Sync web assets into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Push android/ to scaffold branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B mobile/android-scaffold
          git add mobile/android
          git diff --cached --quiet && echo "Nothing to commit — android/ already up to date." && exit 0
          git commit -m "chore(mobile): scaffold Capacitor Android project [skip ci]"
          git push -f origin mobile/android-scaffold
          echo ""
          echo "✅ Done! Open a PR here:"
          echo "https://github.com/${{ github.repository }}/compare/main...mobile/android-scaffold"
