name: Android Bootstrap

# Run once to scaffold mobile/android/ via Capacitor and open a PR.
# After merging that PR the regular "Android Build" workflow handles everything.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    name: Scaffold Android project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Java is NOT needed here — cap add android only scaffolds files, never runs Gradle.
      # Java is only needed in the android-build workflow.

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web bundle (no PWA service worker)
        run: MOBILE=1 pnpm build

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install

      - name: Scaffold Android project (cap add android)
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "mobile/android/ already exists — skipping cap add"
          fi

      - name: Sync web assets into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Open PR with scaffolded android/ folder
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(mobile): scaffold Capacitor Android project"
          branch: mobile/android-scaffold
          title: "chore(mobile): add scaffolded Android project"
          body: |
            Auto-generated by the **Android Bootstrap** workflow.

            This PR adds `mobile/android/` — the Capacitor/Gradle Android project
            generated by `npx cap add android`.

            **After merging**, trigger the **Android Build** workflow to produce a
            sideload-ready `app-debug.apk`.
          add-paths: mobile/android
